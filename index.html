<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Place To Feel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background: #f7f1eb;
            color: #4b4141;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 50px 30px;
        }

        .heart {
            font-size: 28px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 3px;
            margin: 0 0 15px;
        }

        .subtitle {
            font-size: 16px;
            font-style: italic;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .enter-button {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #8c7b7b;
            text-decoration: none;
            color: #4b4141;
            font-size: 14px;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .enter-button:hover {
            background: #4b4141;
            color: white;
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">♡</div>

        <h1>Dear Miranda</h1>

        <div class="subtitle">
            My yapping is here.<br>
            Proceed at your own risk. :D
        </div>

        <a href="#" class="enter-button">ENTER</a>

        <div class="footer">
            A little corner of my thoughts.
        </div>

    </div>

</body>
</html>
