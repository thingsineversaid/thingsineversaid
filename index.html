<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Place To Feel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            background: #f7f1eb;
            color: #4b4141;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 50px 30px;
        }

        .heart {
            font-size: 28px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 3px;
            margin: 0 0 15px;
        }

        .subtitle {
            font-size: 16px;
            font-style: italic;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .enter-button {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #8c7b7b;
            text-decoration: none;
            color: #4b4141;
            font-size: 14px;
            letter-spacing: 2px;
            transition: 0.3s;
            cursor: pointer;
            background: transparent;
        }

        .enter-button:hover {
            background: #4b4141;
            color: white;
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* Password Box */

        .password-box {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-top: 1px solid #d4c8c0;
            border-bottom: 1px solid #d4c8c0;
        }

        .password-box p {
            font-size: 14px;
            font-style: italic;
            line-height: 1.6;
        }

        .password-input {
            width: 100%;
            max-width: 250px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #b8aaa2;
            background: transparent;
            color: #4b4141;
            text-align: center;
            font-family: Georgia, serif;
            outline: none;
        }

        .unlock-button {
            margin-top: 15px;
            padding: 10px 25px;
            border: 1px solid #8c7b7b;
            background: transparent;
            color: #4b4141;
            cursor: pointer;
            font-family: Georgia, serif;
            letter-spacing: 1px;
        }

        .unlock-button:hover {
            background: #4b4141;
            color: white;
        }

        .error-message {
            display: none;
            margin-top: 12px;
            font-size: 13px;
            font-style: italic;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="heart">♡</div>

        <h1>WELCOME TO MY<br>
        BRAIN DUMP</h1>

        <div class="subtitle">
            <br>
            Jangan tanya kenapa kamu sampai di sini. Aku juga ga tahu.
            :)
          
        </div>

        <button class="enter-button" onclick="showPassword()">
            ENTER
        </button>

        <div class="password-box" id="passwordBox">

            <p>
                🔐 A little clue:<br>
                The password is my father's birthday.
            </p>

            <input
                type="password"
                id="passwordInput"
                class="password-input"
                placeholder="Enter password"
            >

            <br>

            <button class="unlock-button" onclick="checkPassword()">
                UNLOCK
            </button>

            <div class="error-message" id="errorMessage">
                Humm... that's not it. Try again. :D
            </div>

        </div>

        <div class="footer">
            "SESUATU YANG KU LEPAS TIDAK AKAN KU CARI LAGI"
            "I’m Not the Only One"
            - 02 September 2026.
        </div>

    </div>


    <script>

        function showPassword() {
            document.getElementById("passwordBox").style.display = "block";
            document.getElementById("passwordInput").focus();
        }

        function checkPassword() {

            const password = document.getElementById("passwordInput").value;

            /*
            GANTI PASSWORD DI BAWAH INI
            Contoh:
            "15011965"
            */

            const correctPassword = "27021968";

            if (password === correctPassword) {

                window.location.href = "diary.html";

            } else {

                document.getElementById("errorMessage").style.display = "block";

            }
        }

    </script>

</body>
</html>
